<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>محمّل — تحميل فيديو وصوت</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <header>
    <h1>محمّل</h1>
    <p>الصق الرابط، اختار فيديو أو صوت، وحمّل. وفي قوائم التشغيل بضغطة واحدة.</p>
  </header>

  <section class="card">
    <label for="url">رابط الفيديو أو قائمة التشغيل</label>
    <div class="row">
      <input id="url" type="url" dir="ltr" placeholder="https://..." autocomplete="off">
      <button id="paste" class="ghost" type="button">لصق</button>
      <button id="fetch" type="button">تحليل الرابط</button>
    </div>
    <p id="msg" class="msg" role="status"></p>
  </section>

  <section id="result" class="card" hidden>
    <div class="preview">
      <img id="thumb" alt="">
      <div>
        <h2 id="title"></h2>
        <p id="meta" class="muted"></p>
      </div>
    </div>

    <div class="seg" role="tablist">
      <button class="on" data-mode="video" type="button">فيديو</button>
      <button data-mode="audio" type="button">صوت MP3</button>
    </div>

    <div class="row opts">
      <div id="qualityBox">
        <label for="quality">الجودة</label>
        <select id="quality">
          <option value="2160">4K (2160p)</option>
          <option value="1440">2K (1440p)</option>
          <option value="1080" selected>1080p</option>
          <option value="720">720p</option>
          <option value="480">480p</option>
          <option value="360">360p</option>
        </select>
      </div>
      <label id="plBox" class="check" hidden>
        <input type="checkbox" id="whole" checked>
        <span>تحميل القائمة كاملة (<b id="count">0</b> عنصر) في ملف ZIP</span>
      </label>
    </div>

    <button id="download" class="big" type="button">تحميل</button>
  </section>

  <footer>
  <div class="social">
